<body>
            <header>
            <h1>
                <span>CINE</span><span>PLAY</span>

            <p>La mejor experiencia cinematográfica</p>

            <!-- Menú de navegación -->

                </ul>
            </nav>    
        </header>
    <main>
        <!-- FORMULARIO DE CONTACTO -->
        <section>
            <h2>Formulario de Contacto</h2>

            <form action="tabla-contacto.html" method="get">

                <fieldset>
                    <legend>Envíanos tu Mensaje</legend>

                    <p>
                        <label for="nombre-contacto">
                            Nombre completo:
                        </label><br>

                        <input type="text" id="nombre-contacto" name="nombre_contacto" placeholder="Ej. Ana Gómez"
                            required>
                    </p>

                    <p>
                        <label for="email-contacto">
                            Correo electrónico:
                        </label><br>

                        <input type="email" id="email-contacto" name="email_contacto" placeholder="ejemplo@correo.com"
                            required>
                    </p>

                    <p>
                        <label for="asunto">
                            Asunto:
                        </label><br>

                        <select id="asunto" name="asunto" required>
                            <option value="">
                                -- Selecciona el motivo --
                            </option>

                            <option value="consulta">
                                Consulta General
                            </option>

                            <option value="reclamo">
                                Reclamo / Queja
                            </option>

                            <option value="sugerencia">
                                Sugerencia
                            </option>
                        </select>
                    </p>

                    <p>
                        <label for="mensaje">
                            Mensaje:
                        </label><br>

                        <textarea id="mensaje" name="mensaje" rows="5" cols="40"
                            placeholder="Escribe tu mensaje aquí..." required></textarea>
                    </p>

                </fieldset>

                <p>
                    <button type="submit">
                        Enviar Mensaje
                    </button>
                </p>

            </form>
        </section>

    </main>

</body>
